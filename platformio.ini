; CYDex — firmware do Dex de mesa no CYD (ESP32-2432S028, ST7789, sem PSRAM).

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200  ; CH340 desta placa dá ruído a 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; Setup do TFT_eSPI (pinos de board_pins.h) forçado em toda unidade de
    ; compilação antes de qualquer <TFT_eSPI.h>.
    -include include/tft_setup.h
lib_deps =
    lvgl/lvgl @ 8.3.11
    bodmer/TFT_eSPI @ 2.5.43

; Testes no PC: só lib/core (C++ puro, sem Arduino).
[env:native_test]
platform = native
test_framework = unity
build_flags =
    -std=c++17
lib_compat_mode = off
lib_ignore = lvgl, TFT_eSPI
