# Release do app de bandeja do CYDex (desktop/).
#
#   git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
#
# ou "Run workflow" na aba Actions com a versão. A versão da tag vai pro
# tauri.conf.json, Cargo.toml e package.json antes do build (não precisa
# editar à mão). Os três sistemas sobem os instaladores numa release em
# rascunho; quando todos terminam, ela é publicada.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão X.Y.Z (ex.: 0.2.0). Cria a tag desktop-v<versão> no commit escolhido."
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Versão
        id: version
        env:
          INPUT: ${{ inputs.version }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT" ]; then v="${INPUT#v}"; else v="${REF#desktop-v}"; fi
          # Só X.Y.Z: o .msi (WiX) não aceita sufixo como "-beta".
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::versão inválida: '$v' (use 1.2.3)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$v" >> "$GITHUB_OUTPUT"

      - name: Cria a release (rascunho)
        id: release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { TAG, VERSION } = process.env;
            const body = [
              "Instaladores do app de bandeja do CYDex.",
              "",
              "| Sistema | Arquivo |",
              "|---|---|",
              "| macOS (Intel e Apple Silicon) | `.dmg` |",
              "| Windows | `.msi` ou `-setup.exe` |",
              "| Linux | `.AppImage`, `.deb` ou `.rpm` |",
              "",
              "Os instaladores não são assinados:",
              "- **macOS**: se aparecer \"está danificado\" ou \"não pode ser aberto\", arraste o app pra Aplicativos e rode `xattr -cr /Applications/CYDex.app`.",
              "- **Windows**: no aviso do SmartScreen, clique em \"Mais informações\" › \"Executar assim mesmo\".",
              "",
              "Precisa do firmware com `api: 2` (rotas `/saves` e `/dex`) pra Saves e Dex. Apagar/acender e avisos funcionam com o firmware anterior.",
            ].join("\n");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: TAG,
              target_commitish: context.sha,
              name: `CYDex Desktop ${VERSION}`,
              body,
              draft: true,
            });
            core.setOutput("id", data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust_targets: ""
          - os: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux (WebKitGTK, bandeja)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Versão da tag no app
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            for (const f of ["src-tauri/tauri.conf.json", "package.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            const c = "src-tauri/Cargo.toml";
            fs.writeFileSync(c, fs.readFileSync(c, "utf8").replace(/^version = ".*"$/m, `version = "${v}"`));
          '

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publica a release
        uses: actions/github-script@v7
        env:
          ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.ID),
              draft: false,
            });
